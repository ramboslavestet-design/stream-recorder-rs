[package]
name = "apto"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A generic, trait-based Rust config framework with a declarative macro"
repository = "https://github.com/sn0w12/stream-recorder-rs"
keywords = ["config", "configuration", "toml", "macro"]
categories = ["config", "rust-patterns"]

[dependencies]
paste = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
toml = "1.1"
tempfile = "3.27"
